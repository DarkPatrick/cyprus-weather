# Public weather only; the existing dashboard retains Basic Auth.
location /cyprus-weather/api/ {
    access_log off;  # Kairo: URLs carry the anonymous id, station and elevation
    auth_basic off;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8092/api/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}
